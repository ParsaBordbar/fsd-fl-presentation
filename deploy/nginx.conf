# Free AI Without Moving the Data — reveal.js deck at fsd.bbrand.ir
#
# Install (on the server):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/fsd.bbrand.ir
#   sudo ln -s /etc/nginx/sites-available/fsd.bbrand.ir /etc/nginx/sites-enabled/
#   sudo mkdir -p /var/www/fsd.bbrand.ir
#   sudo nginx -t && sudo systemctl reload nginx
#
# Deploy the deck (from this repo, after `python3 build_single.py`):
#   scp dist/index.html user@server:/var/www/fsd.bbrand.ir/index.html
#
# TLS (after the DNS A/AAAA record for fsd.bbrand.ir points at this server):
#   sudo certbot --nginx -d fsd.bbrand.ir
# Certbot rewrites this file to add the 443 block and an 80 -> 443 redirect.

server {
    listen 80;
    listen [::]:80;
    server_name fsd.bbrand.ir;

    root /var/www/fsd.bbrand.ir;
    index index.html;

    # The deck is a single self-contained file (fonts, JS, CSS inlined),
    # so only index.html is ever requested. Everything else is 404.
    location = / {
        try_files /index.html =404;
    }
    location = /index.html {
        try_files /index.html =404;
    }
    location = /favicon.ico {
        return 204;
        access_log off;
    }
    location / {
        return 404;
    }

    # Fresh deck every reload — hash routing (#/12) never hits the server,
    # and ~1.2 MB gzips well, so no-cache costs nothing noticeable.
    add_header Cache-Control "no-cache" always;
    etag on;

    gzip on;
    gzip_types text/html;
    gzip_min_length 1024;
    gzip_vary on;

    # Speaker notes (S key) open a popup that iframes this same origin.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log /var/log/nginx/fsd.bbrand.ir.access.log;
    error_log  /var/log/nginx/fsd.bbrand.ir.error.log;
}
